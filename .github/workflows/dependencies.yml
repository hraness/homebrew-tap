name: Deliver checked action updates
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: tap-dependency-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: >-
      github.repository == 'hraness/homebrew-tap' &&
      github.repository_id == '1382935233' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == 1382935233 &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: hraness/product-skills/actions/deliver-dependabot@f72d7cca0794bce77a996073b9196e639e085947 # v0.1.84
        with:
          repository-id: '1382935233'
          owner-id: '307125679'
          visibility: public
          check-workflow: ci.yml
          app-id: ${{ vars.DISTRIBUTION_APP_ID }}
          app-private-key: ${{ secrets.DISTRIBUTION_APP_PRIVATE_KEY }}
