name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  # Path gate lives inside the workflow so `Required` always reports.
  changes:
    runs-on: hraness-cf
    timeout-minutes: 3
    outputs:
      formula: ${{ steps.filter.outputs.formula }}
      cask: ${{ steps.filter.outputs.cask }}
      audit: ${{ steps.audit.outputs.casks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: filter
        name: Detect formula changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ]; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
            echo "cask=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
            echo "cask=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(Formula/|tools/|\.github/workflows/)'; then
            echo "formula=true" >> "$GITHUB_OUTPUT"
          else
            echo "formula=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE '^(Casks/|catalog/|cask_renames\.json$|tools/check-sponge-rename|tools/yaptake-|tools/oh-cask|tools/check-yaptake|tools/check-app-cask|test/|\.github/workflows/)'; then
            echo "cask=true" >> "$GITHUB_OUTPUT"
          else
            echo "cask=false" >> "$GITHUB_OUTPUT"
          fi
      - id: audit
        name: Choose the casks for the online audit
        # A new app release makes an unchanged cask's version or minimum macOS
        # stale. Audit online only the casks this change updates, so one app's
        # release cannot block another app's update. Manual runs audit every cask.
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if { [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; } &&
            [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE" HEAD -- Casks catalog
          else
            git ls-files Casks
          fi | sed -nE 's#^(Casks|catalog)/([a-z0-9-]+)\.(rb|json)$#\2#p' | sort -u |
            while IFS= read -r name; do if [ -f "Casks/$name.rb" ]; then printf '%s\n' "$name"; fi; done |
            jq -Rnc '[inputs]' > "$RUNNER_TEMP/audit.json"
          cat "$RUNNER_TEMP/audit.json"
          echo "casks=$(cat "$RUNNER_TEMP/audit.json")" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    runs-on: hraness-cf
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby for formula syntax checks
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby
      - name: Ruby syntax
        run: for f in Formula/*.rb Casks/*.rb; do ruby -c "$f"; done
      - name: Generator syntax
        run: |
          node --check tools/brew-formula.mjs
          node --check tools/oh-cask.mjs
          node --check tools/oh-router-formula.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Public Yaptake and OH generators and preservation boundaries
        run: |
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p 'test_*.py' -v
          node tools/yaptake-cask.mjs --check
          node tools/oh-cask.mjs --check
          node tools/oh-router-formula.mjs --check
          bash -n tools/check-yaptake-install
          bash -n tools/check-app-cask
      - name: Formula matches the generator output
        # Fetches release sidecars, so only run it when the formula side changed.
        if: needs.changes.outputs.formula == 'true'
        run: |
          tag="$(sed -n 's|.*/releases/download/\(v[^/]*\)/.*|\1|p' Formula/vhalla.rb | sort -u)"
          test "$(echo "$tag" | wc -l)" -eq 1 && test -n "$tag"
          node tools/brew-formula.mjs "$tag"
          git diff --exit-code -- Formula/vhalla.rb

  brew:
    needs: changes
    if: needs.changes.outputs.formula == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The formula also ships the static Linux arm64 archive; hosted arm64
        # runners have no preinstalled Homebrew, so CI checks macOS arm64 and
        # Linux x86_64 only.
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ contains(fromJSON('["ubuntu-latest","ubuntu-24.04","ubuntu-slim"]'), matrix.os) && 'hraness-cf' || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Homebrew in the ephemeral Linux runner
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main, 2026-11-20
      - name: Install Ruby for the Linux metadata assertions
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ruby
      - name: Put Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Tap this checkout as hraness/tap
        run: |
          tap="$(brew --repository)/Library/Taps/hraness/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          rm -rf "$tap"
          ln -s "$GITHUB_WORKSPACE" "$tap"
          brew tap
      - name: Trust only the formulae under test
        run: |
          # Older runner images can predate Homebrew's tap-trust command.
          if brew command trust >/dev/null 2>&1; then
            brew trust --formula hraness/tap/vhalla
            brew trust --formula hraness/tap/oh-router
          fi
      - name: brew style
        run: brew style hraness/tap
      - name: brew audit
        run: |
          brew audit --strict --formula hraness/tap/vhalla
          brew audit --strict --formula hraness/tap/oh-router
      - name: Install, test and uninstall oh-router formula
        run: |
          brew install hraness/tap/oh-router
          brew test hraness/tap/oh-router
          oh-router --version | grep -Fq "oh-router "
          brew uninstall hraness/tap/oh-router
          test ! -d "$(brew --cellar)/oh-router"
      - name: Confirm retired formula metadata
        run: |
          brew info --json=v2 hraness/tap/vhalla | ruby -rjson -e '
            formulae = JSON.parse(STDIN.read).fetch("formulae")
            abort "expected exactly one formula" unless formulae.length == 1
            formula = formulae.fetch(0)
            expected = {
              "name" => "vhalla",
              "tap" => "hraness/tap",
              "disabled" => true,
              "disable_date" => "2026-11-03",
              "disable_reason" => "deprecated_upstream",
            }
            expected.each do |key, value|
              abort "unexpected #{key}: #{formula[key].inspect}" unless formula.fetch(key) == value
            end
          '
      - name: Refuse installation of retired Valhalla
        run: |
          test ! -d "$(brew --cellar)/vhalla"
          set +e
          output="$(brew install --build-from-source hraness/tap/vhalla 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'hraness/tap/vhalla has been disabled because it is deprecated upstream!' <<< "$output"
          test ! -d "$(brew --cellar)/vhalla"

  cask:
    name: Yaptake cask
    needs: changes
    if: needs.changes.outputs.cask == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Tap only this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/hraness/homebrew-tap"
          test ! -e "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - name: Trust only the cask under test before audit
        run: |
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask hraness/tap/yaptake
          fi
      - run: brew style --cask hraness/tap/yaptake
      - name: Audit online when this change updates the cask
        if: contains(fromJSON(needs.changes.outputs.audit), 'yaptake')
        run: brew audit --strict --online --cask hraness/tap/yaptake
      - name: Verify exact bytes, normal installation and data-preserving uninstall
        run: tools/check-yaptake-install

  app-casks:
    name: ${{ matrix.name }} cask
    needs: changes
    if: needs.changes.outputs.cask == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sponge
            cask: sponge-app
            app: Sponge.app
            bundle: com.hraness.sponge.mac
          - name: Textmock
            cask: textmock
            app: Textmock.app
            bundle: com.hraness.textmock.mac
            command: textmock
            arg: --help
            expect: 'usage: textmock'
          - name: DAWN
            cask: dawn
            app: DAWN.app
            bundle: com.hraness.dawn
            command: dawn
            arg: --version
            expect: 'dawn '
          - name: OH
            cask: oh
            app: Oh.app
            bundle: computer.oh.app
    env:
      CASK: hraness/tap/${{ matrix.cask }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tap only this checkout
        run: |
          tap="$(brew --repository)/Library/Taps/hraness/homebrew-tap"
          test ! -e "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - name: Trust only the cask under test before audit
        run: |
          if brew command trust >/dev/null 2>&1; then
            brew trust --cask "$CASK"
          fi
      - run: brew style --cask "$CASK"
      - name: Audit online when this change updates the cask
        if: contains(fromJSON(needs.changes.outputs.audit), matrix.cask)
        run: brew audit --strict --online --cask "$CASK"
      - name: Migrate the existing Sponge installation to its new cask token
        if: matrix.cask == 'sponge-app'
        run: tools/check-sponge-rename
      - name: Install, adopt an existing copy and uninstall with data kept
        env:
          TOKEN: ${{ matrix.cask }}
          APP: ${{ matrix.app }}
          BUNDLE: ${{ matrix.bundle }}
          COMMAND: ${{ matrix.command }}
          ARG: ${{ matrix.arg }}
          EXPECT: ${{ matrix.expect }}
        run: |
          if [ -n "$COMMAND" ]; then
            tools/check-app-cask "$TOKEN" "$APP" "$BUNDLE" "$COMMAND" "$ARG" "$EXPECT"
          else
            tools/check-app-cask "$TOKEN" "$APP" "$BUNDLE"
          fi

  Required:
    if: always()
    needs: [changes, lint, brew, cask, app-casks]
    runs-on: hraness-cf
    timeout-minutes: 2
    steps:
      - name: All gates passed or were skipped by the path gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
